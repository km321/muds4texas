<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-labelledby="stack-title stack-desc" preserveAspectRatio="xMidYMid meet">
  <title id="stack-title">Property Tax Stack</title>
  <desc id="stack-desc">Visual showing how property tax includes multiple entities: county, school, city, and MUD as stacked layers on one tax bill</desc>
  <defs>
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-stack { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0D0D0D; }
    .label-small { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #4A2511; }
    .label-header { font-family: "Bebas Neue", Impact, sans-serif; font-size: 16px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-white { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #FFF8E7; }
    .label-note { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #A65D2C; }
  </style>
  
  <!-- Background card -->
  <rect x="10" y="10" width="360" height="300" rx="6" fill="#151515" filter="url(#shadow)"/>
  <rect x="12" y="12" width="356" height="296" rx="5" fill="#1A1A1A" stroke="#4A2511" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="340" height="32" rx="4" fill="url(#corkGrad)"/>
  <text x="190" y="42" text-anchor="middle" class="label-header">YOUR PROPERTY TAX BILL</text>
  
  <!-- Tax stack layers -->
  <g transform="translate(40, 70)">
    <!-- County layer -->
    <rect x="0" y="0" width="300" height="44" rx="4" fill="url(#brassGrad)" stroke="#A65D2C" stroke-width="1.5"/>
    <text x="150" y="20" text-anchor="middle" class="label-stack">County</text>
    <text x="150" y="34" text-anchor="middle" class="label-small">General county services</text>
    
    <!-- School layer -->
    <rect x="0" y="50" width="300" height="44" rx="4" fill="url(#brassGrad)" stroke="#A65D2C" stroke-width="1.5"/>
    <text x="150" y="70" text-anchor="middle" class="label-stack">School District</text>
    <text x="150" y="84" text-anchor="middle" class="label-small">Public education funding</text>
    
    <!-- City layer (if applicable) -->
    <rect x="0" y="100" width="300" height="44" rx="4" fill="url(#brassGrad)" stroke="#A65D2C" stroke-width="1.5"/>
    <text x="150" y="120" text-anchor="middle" class="label-stack">City (if applicable)</text>
    <text x="150" y="134" text-anchor="middle" class="label-small">Municipal services</text>
    
    <!-- MUD layer - highlighted -->
    <rect x="0" y="150" width="300" height="44" rx="4" fill="url(#tealGrad)" stroke="#4DB6AC" stroke-width="2"/>
    <text x="150" y="170" text-anchor="middle" class="label-white">Municipal Utility District</text>
    <text x="150" y="184" text-anchor="middle" style="font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 11px; fill: #B2DFDB;">Water, sewer, drainage, etc.</text>
  </g>
  
  <!-- Bracket annotation -->
  <path d="M350 70 L360 70 L360 264 L350 264" fill="none" stroke="#D4A574" stroke-width="1.5"/>
  <text x="355" y="172" text-anchor="middle" transform="rotate(90 355 172)" style="font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 11px; fill: #D4A574;">One bill, multiple entities</text>
  
  <!-- Footer note -->
  <text x="190" y="280" text-anchor="middle" class="label-note">MUD is one piece of the stack, not a separate "extra fee"</text>
  <text x="190" y="295" text-anchor="middle" class="label-note">Entities and rates vary by property</text>
</svg>
