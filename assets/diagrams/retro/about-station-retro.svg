<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" role="img" aria-labelledby="about-title about-desc" preserveAspectRatio="xMidYMid meet">
  <title id="about-title">About the Station</title>
  <desc id="about-desc">Visual showing the mission of MUDs 4 Texas as an education hub with a radio station metaphor</desc>
  <defs>
    <linearGradient id="corkGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="redGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .label-header5 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 14px; letter-spacing: 0.1em; fill: #FFF8E7; }
    .label-main5 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #FFF8E7; }
    .label-sub5 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #D4A574; }
  </style>
  
  <!-- Background - corkboard style -->
  <rect x="5" y="5" width="330" height="250" rx="4" fill="url(#corkGrad5)" filter="url(#shadow5)"/>
  <rect x="8" y="8" width="324" height="244" rx="3" fill="url(#corkGrad5)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Pin at top -->
  <circle cx="170" cy="20" r="8" fill="url(#redGrad5)" stroke="#B71C1C" stroke-width="1"/>
  <circle cx="168" cy="18" r="2" fill="#FFCDD2" opacity="0.6"/>
  
  <!-- Card content -->
  <rect x="25" y="35" width="290" height="200" rx="3" fill="#FFF8E7" stroke="#D4A574" stroke-width="1"/>
  
  <!-- ON AIR badge -->
  <rect x="120" y="45" width="100" height="26" rx="4" fill="url(#redGrad5)" filter="url(#glow5)"/>
  <text x="170" y="63" text-anchor="middle" class="label-header5">ON AIR</text>
  
  <!-- Station name -->
  <text x="170" y="95" text-anchor="middle" style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 22px; letter-spacing: 0.06em; fill: #4A2511;">MUDs 4 TEXAS</text>
  
  <!-- Divider -->
  <line x1="60" y1="108" x2="280" y2="108" stroke="#D4A574" stroke-width="1"/>
  
  <!-- Mission items -->
  <g transform="translate(45, 120)">
    <circle cx="10" cy="8" r="4" fill="url(#tealGrad5)"/>
    <text x="22" y="12" style="font-family: 'Source Sans 3', sans-serif; font-size: 11px; fill: #4A2511;">Plain-language MUD education</text>
    
    <circle cx="10" cy="30" r="4" fill="url(#tealGrad5)"/>
    <text x="22" y="34" style="font-family: 'Source Sans 3', sans-serif; font-size: 11px; fill: #4A2511;">Pointers to official sources</text>
    
    <circle cx="10" cy="52" r="4" fill="url(#tealGrad5)"/>
    <text x="22" y="56" style="font-family: 'Source Sans 3', sans-serif; font-size: 11px; fill: #4A2511;">No sales pressure or lead forms</text>
    
    <circle cx="10" cy="74" r="4" fill="url(#tealGrad5)"/>
    <text x="22" y="78" style="font-family: 'Source Sans 3', sans-serif; font-size: 11px; fill: #4A2511;">Not legal, tax, or financial advice</text>
  </g>
  
  <!-- Footer -->
  <text x="170" y="220" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #8B4513;">Education hub for Texas homeowners</text>
</svg>
