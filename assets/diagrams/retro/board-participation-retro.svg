<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" role="img" aria-labelledby="board-title board-desc" preserveAspectRatio="xMidYMid meet">
  <title id="board-title">Board Meeting Participation</title>
  <desc id="board-desc">Visual showing how residents can participate in MUD board meetings: read agenda, attend, use public comment, follow up</desc>
  <defs>
    <linearGradient id="corkGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-header4 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 15px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-step { font-family: "Bebas Neue", Impact, sans-serif; font-size: 20px; fill: #26A69A; }
    .label-main4 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #FFF8E7; }
    .label-sub4 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #D4A574; }
    .label-note4 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #A65D2C; }
  </style>
  
  <!-- Background card -->
  <rect x="10" y="10" width="360" height="260" rx="6" fill="#151515" filter="url(#shadow4)"/>
  <rect x="12" y="12" width="356" height="256" rx="5" fill="#1A1A1A" stroke="#4A2511" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="340" height="30" rx="4" fill="url(#corkGrad4)"/>
  <text x="190" y="40" text-anchor="middle" class="label-header4">BOARD MEETING PARTICIPATION</text>
  
  <!-- Step boxes -->
  <g transform="translate(25, 60)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="160" height="70" rx="4" fill="#1E1E1E" stroke="#4A2511" stroke-width="1"/>
    <text x="20" y="30" class="label-step">1</text>
    <text x="45" y="25" class="label-main4">Read the agenda</text>
    <text x="45" y="40" class="label-sub4">Posted on district</text>
    <text x="45" y="52" class="label-sub4">website or location</text>
    
    <!-- Step 2 -->
    <rect x="170" y="0" width="160" height="70" rx="4" fill="#1E1E1E" stroke="#4A2511" stroke-width="1"/>
    <text x="190" y="30" class="label-step">2</text>
    <text x="215" y="25" class="label-main4">Attend the meeting</text>
    <text x="215" y="40" class="label-sub4">Public meetings are</text>
    <text x="215" y="52" class="label-sub4">generally open</text>
    
    <!-- Arrow between rows -->
    <path d="M165 70 L165 90 L165 85 M160 85 L165 90 L170 85" fill="none" stroke="#26A69A" stroke-width="2"/>
    
    <!-- Step 3 -->
    <rect x="0" y="80" width="160" height="70" rx="4" fill="#1E1E1E" stroke="#4A2511" stroke-width="1"/>
    <text x="20" y="110" class="label-step">3</text>
    <text x="45" y="105" class="label-main4">Use public comment</text>
    <text x="45" y="120" class="label-sub4">Follow meeting rules</text>
    <text x="45" y="132" class="label-sub4">for your district</text>
    
    <!-- Step 4 -->
    <rect x="170" y="80" width="160" height="70" rx="4" fill="#1E1E1E" stroke="#4A2511" stroke-width="1"/>
    <text x="190" y="110" class="label-step">4</text>
    <text x="215" y="105" class="label-main4">Follow up</text>
    <text x="215" y="120" class="label-sub4">Records requests via</text>
    <text x="215" y="132" class="label-sub4">district posted process</text>
  </g>
  
  <!-- Info box -->
  <rect x="30" y="220" width="320" height="40" rx="4" fill="url(#tealGrad4)"/>
  <text x="190" y="238" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600; fill: #FFF8E7;">Participation differs from city council, but it is public government</text>
  <text x="190" y="252" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #B2DFDB;">Day-to-day issues often go to the operator first</text>
</svg>
