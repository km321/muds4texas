<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" role="img" aria-labelledby="water-title water-desc" preserveAspectRatio="xMidYMid meet">
  <title id="water-title">Water Bill vs MUD Tax</title>
  <desc id="water-desc">Visual showing that your monthly water bill is separate from the annual MUD property tax</desc>
  <defs>
    <linearGradient id="corkGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="brassGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-header3 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 15px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-main3 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0D0D0D; }
    .label-sub3 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #4A2511; }
    .label-white3 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #FFF8E7; }
    .label-note3 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #D4A574; }
    .icon-style { fill: none; stroke: #4A2511; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  
  <!-- Background card -->
  <rect x="10" y="10" width="360" height="240" rx="6" fill="#151515" filter="url(#shadow3)"/>
  <rect x="12" y="12" width="356" height="236" rx="5" fill="#1A1A1A" stroke="#4A2511" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="340" height="30" rx="4" fill="url(#corkGrad3)"/>
  <text x="190" y="40" text-anchor="middle" class="label-header3">TWO SEPARATE PAYMENTS</text>
  
  <!-- Left card: Water bill -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="150" height="120" rx="4" fill="url(#tealGrad3)"/>
    <!-- Water drop icon -->
    <path d="M75 25 C75 25, 55 50, 55 65 C55 76, 64 85, 75 85 C86 85, 95 76, 95 65 C95 50, 75 25, 75 25" fill="#B2DFDB" stroke="#00838F" stroke-width="1.5"/>
    <text x="75" y="105" text-anchor="middle" class="label-white3">Water/Sewer Bill</text>
    <rect x="10" y="125" width="130" height="40" rx="3" fill="#1A3A38"/>
    <text x="75" y="143" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 10px; fill: #4DB6AC;">Monthly to operator</text>
    <text x="75" y="157" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #80CBC4;">Usage-based charges</text>
  </g>
  
  <!-- Center divider with "not equal" -->
  <text x="190" y="140" text-anchor="middle" style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 28px; fill: #E53935;">`</text>
  <text x="190" y="155" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #D4A574;">different</text>
  
  <!-- Right card: MUD Tax -->
  <g transform="translate(200, 65)">
    <rect x="0" y="0" width="150" height="120" rx="4" fill="url(#brassGrad3)" stroke="#A65D2C" stroke-width="1.5"/>
    <!-- Document icon -->
    <rect x="55" y="20" width="40" height="50" rx="2" fill="#FFF8E7" stroke="#4A2511" stroke-width="1.5"/>
    <line x1="62" y1="32" x2="88" y2="32" class="icon-style" stroke-width="1"/>
    <line x1="62" y1="42" x2="88" y2="42" class="icon-style" stroke-width="1"/>
    <line x1="62" y1="52" x2="80" y2="52" class="icon-style" stroke-width="1"/>
    <text x="75" y="105" text-anchor="middle" class="label-main3">MUD Property Tax</text>
    <rect x="10" y="125" width="130" height="40" rx="3" fill="#3A2A1A"/>
    <text x="75" y="143" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 10px; fill: #D4A574;">Annual via tax bill</text>
    <text x="75" y="157" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #A65D2C;">May be escrowed</text>
  </g>
  
  <!-- Footer note -->
  <text x="190" y="230" text-anchor="middle" class="label-note3">Pay each through the correct channel for your district</text>
</svg>
