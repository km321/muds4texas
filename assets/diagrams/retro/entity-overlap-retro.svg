<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="overlap-title overlap-desc" preserveAspectRatio="xMidYMid meet">
  <title id="overlap-title">Entity Overlap</title>
  <desc id="overlap-desc">Visual showing how MUD, PID, and HOA can overlap on the same property</desc>
  <defs>
    <linearGradient id="corkGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="brassGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="coralGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8B7A"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-header8 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 14px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-circle { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .label-note8 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #D4A574; }
  </style>
  
  <!-- Background card -->
  <rect x="10" y="10" width="340" height="200" rx="6" fill="#151515" filter="url(#shadow8)"/>
  <rect x="12" y="12" width="336" height="196" rx="5" fill="#1A1A1A" stroke="#4A2511" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="320" height="28" rx="4" fill="url(#corkGrad8)"/>
  <text x="180" y="40" text-anchor="middle" class="label-header8">ENTITIES CAN OVERLAP</text>
  
  <!-- Venn diagram style circles -->
  <g transform="translate(180, 115)">
    <!-- MUD circle -->
    <circle cx="-55" cy="-10" r="50" fill="url(#tealGrad8)" opacity="0.7"/>
    <text x="-80" y="-15" class="label-circle" fill="#FFF8E7">MUD</text>
    <text x="-80" y="-2" style="font-size: 8px; fill: #B2DFDB;">Government</text>
    
    <!-- PID circle -->
    <circle cx="55" cy="-10" r="50" fill="url(#brassGrad8)" opacity="0.7"/>
    <text x="70" y="-15" class="label-circle" fill="#4A2511">PID</text>
    <text x="65" y="-2" style="font-size: 8px; fill: #8B4513;">Assessment</text>
    
    <!-- HOA circle -->
    <circle cx="0" cy="40" r="50" fill="url(#coralGrad8)" opacity="0.7"/>
    <text x="0" y="55" text-anchor="middle" class="label-circle" fill="#FFF8E7">HOA</text>
    <text x="0" y="68" text-anchor="middle" style="font-size: 8px; fill: #FFCDD2;">Private</text>
    
    <!-- Overlap center indicator -->
    <circle cx="0" cy="10" r="6" fill="#FFF8E7" stroke="#E53935" stroke-width="2"/>
  </g>
  
  <!-- Footer note -->
  <text x="180" y="185" text-anchor="middle" class="label-note8">A single property can have all three at once. Check each one.</text>
</svg>
