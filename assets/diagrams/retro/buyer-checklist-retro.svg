<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="check-title check-desc" preserveAspectRatio="xMidYMid meet">
  <title id="check-title">Buyer Questions Checklist</title>
  <desc id="check-desc">Visual checklist of key questions to ask when buying in a MUD</desc>
  <defs>
    <linearGradient id="corkGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-header6 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 14px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-item { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; fill: #4A2511; }
    .check-box { fill: #FFF8E7; stroke: #26A69A; stroke-width: 2; }
    .check-mark { fill: none; stroke: #26A69A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  
  <!-- Background - corkboard style -->
  <rect x="5" y="5" width="350" height="290" rx="4" fill="url(#corkGrad6)" filter="url(#shadow6)"/>
  <rect x="8" y="8" width="344" height="284" rx="3" stroke="#8B4513" stroke-width="2" fill="url(#corkGrad6)"/>
  
  <!-- Pins at corners -->
  <circle cx="25" cy="25" r="6" fill="#E53935"/>
  <circle cx="335" cy="25" r="6" fill="#26A69A"/>
  
  <!-- Paper note -->
  <rect x="20" y="40" width="320" height="240" rx="2" fill="#FFF8E7" transform="rotate(-0.5 180 160)"/>
  <rect x="20" y="40" width="320" height="30" rx="2" fill="url(#tealGrad6)"/>
  <text x="180" y="60" text-anchor="middle" class="label-header6">QUESTIONS TO ASK</text>
  
  <!-- Checklist items -->
  <g transform="translate(35, 85)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 8 L7 12 L13 4" class="check-mark"/>
    <text x="25" y="13" class="label-item">Which MUD includes this address?</text>
    
    <!-- Item 2 -->
    <rect x="0" y="28" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 36 L7 40 L13 32" class="check-mark"/>
    <text x="25" y="41" class="label-item">May I have the Notice to Purchaser?</text>
    
    <!-- Item 3 -->
    <rect x="0" y="56" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 64 L7 68 L13 60" class="check-mark"/>
    <text x="25" y="69" class="label-item">What is the current MUD tax rate?</text>
    
    <!-- Item 4 -->
    <rect x="0" y="84" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 92 L7 96 L13 88" class="check-mark"/>
    <text x="25" y="97" class="label-item">Will my lender escrow the MUD tax?</text>
    
    <!-- Item 5 -->
    <rect x="0" y="112" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 120 L7 124 L13 116" class="check-mark"/>
    <text x="25" y="125" class="label-item">Who bills water/sewer, and setup steps?</text>
    
    <!-- Item 6 -->
    <rect x="0" y="140" width="16" height="16" rx="2" class="check-box"/>
    <path d="M3 148 L7 152 L13 144" class="check-mark"/>
    <text x="25" y="153" class="label-item">Is there also an HOA, PID, or both?</text>
    
    <!-- Item 7 -->
    <rect x="0" y="168" width="16" height="16" rx="2" class="check-box"/>
    <text x="25" y="181" class="label-item">ETJ or city limits? Partnership agreement?</text>
  </g>
  
  <!-- Footer note -->
  <text x="180" y="270" text-anchor="middle" style="font-family: 'Source Sans 3', sans-serif; font-size: 9px; fill: #8B4513;">Keep answers with your closing file</text>
</svg>
