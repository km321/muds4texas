<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" role="img" aria-labelledby="rate-title rate-desc" preserveAspectRatio="xMidYMid meet">
  <title id="rate-title">MUD Tax Rate Timeline</title>
  <desc id="rate-desc">Visual showing how MUD tax rates can change over time based on debt and board decisions, with no guaranteed end date</desc>
  <defs>
    <linearGradient id="corkGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F4A"/>
      <stop offset="100%" stop-color="#A65D2C"/>
    </linearGradient>
    <linearGradient id="tealGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .label-header2 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 15px; letter-spacing: 0.08em; fill: #FFF8E7; }
    .label-axis { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #D4A574; }
    .label-note2 { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; fill: #A65D2C; }
    .label-warn { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #E53935; }
  </style>
  
  <!-- Background card -->
  <rect x="10" y="10" width="360" height="260" rx="6" fill="#151515" filter="url(#shadow2)"/>
  <rect x="12" y="12" width="356" height="256" rx="5" fill="#1A1A1A" stroke="#4A2511" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="340" height="30" rx="4" fill="url(#corkGrad2)"/>
  <text x="190" y="40" text-anchor="middle" class="label-header2">MUD TAX RATES OVER TIME</text>
  
  <!-- Chart area -->
  <g transform="translate(50, 70)">
    <!-- Axes -->
    <line x1="0" y1="120" x2="280" y2="120" stroke="#4A2511" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#4A2511" stroke-width="1"/>
    
    <!-- Y-axis labels -->
    <text x="-8" y="10" text-anchor="end" class="label-axis">High</text>
    <text x="-8" y="65" text-anchor="end" class="label-axis">Rate</text>
    <text x="-8" y="118" text-anchor="end" class="label-axis">Low</text>
    
    <!-- X-axis labels -->
    <text x="0" y="135" text-anchor="middle" class="label-axis">Now</text>
    <text x="140" y="135" text-anchor="middle" class="label-axis">Years</text>
    <text x="280" y="135" text-anchor="middle" class="label-axis">Future</text>
    
    <!-- Rate line showing fluctuation -->
    <path d="M0 40 Q30 35, 50 45 T100 50 T140 35 T180 55 T220 40 T260 60" 
          fill="none" stroke="url(#tealGrad2)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dots at key points -->
    <circle cx="0" cy="40" r="5" fill="#26A69A"/>
    <circle cx="100" cy="50" r="5" fill="#26A69A"/>
    <circle cx="180" cy="55" r="5" fill="#26A69A"/>
    <circle cx="260" cy="60" r="5" fill="#26A69A"/>
    
    <!-- Question mark at end -->
    <text x="280" y="65" style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; fill: #E53935;">?</text>
    
    <!-- Annotations -->
    <rect x="60" y="70" width="80" height="18" rx="3" fill="#4A2511"/>
    <text x="100" y="83" text-anchor="middle" style="font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 9px; fill: #FFF8E7;">Debt paid down</text>
    
    <rect x="180" y="80" width="80" height="18" rx="3" fill="#4A2511"/>
    <text x="220" y="93" text-anchor="middle" style="font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 9px; fill: #FFF8E7;">New bonds issued</text>
  </g>
  
  <!-- Warning callout -->
  <rect x="30" y="210" width="320" height="48" rx="4" fill="#2A1A1A" stroke="#E53935" stroke-width="1.5"/>
  <text x="190" y="230" text-anchor="middle" class="label-warn">No automatic "end date"</text>
  <text x="190" y="248" text-anchor="middle" class="label-note2">Rates change with debt, board decisions, and law. Read district documents.</text>
</svg>
