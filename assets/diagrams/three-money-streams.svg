<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="streams-title streams-desc">
  <title id="streams-title">Three money streams diagram</title>
  <desc id="streams-desc">Visual showing how MUD tax, water bill, and HOA or PID are separate payment streams for a property</desc>
  
  <style>
    .label-main { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0B1726; }
    .label-sub { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4A5560; }
    .label-how { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #4A5560; }
    .node-fill { fill: #F7F8F6; }
    .node-stroke { stroke: #1B4F72; stroke-width: 1.5; fill: none; }
    .node-clay { stroke: #C45C26; stroke-width: 2; fill: none; }
    .connector { stroke: #C5CBC4; stroke-width: 1.5; fill: none; }
    .badge { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #FCFDFB; }
    .badge-bg { fill: #1B4F72; }
    .badge-clay { fill: #C45C26; }
    .ground-fill { fill: #E6E9E4; }
  </style>

  <!-- Background -->
  <rect width="720" height="280" class="ground-fill" rx="6"/>
  
  <!-- Property node at top center -->
  <g transform="translate(360, 40)">
    <rect x="-70" y="-20" width="140" height="40" rx="4" class="node-fill"/>
    <rect x="-70" y="-20" width="140" height="40" rx="4" class="node-stroke"/>
    <text x="0" y="5" text-anchor="middle" class="label-main">Your property</text>
  </g>
  
  <!-- Connector lines from property to three streams -->
  <path d="M300 60 L300 90 M360 60 L360 90 M420 60 L420 90" class="connector"/>
  <path d="M300 60 L120 90 M420 60 L600 90" class="connector"/>
  
  <!-- Stream A: MUD Tax (with clay accent as main topic) -->
  <g transform="translate(120, 160)">
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-fill"/>
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-clay"/>
    <rect x="-32" y="-75" width="64" height="20" rx="10" class="badge-clay"/>
    <text x="0" y="-61" text-anchor="middle" class="badge">(a) Tax</text>
    <text x="0" y="-30" text-anchor="middle" class="label-main">Ad valorem MUD tax</text>
    <text x="0" y="-10" text-anchor="middle" class="label-sub">Property tax levied</text>
    <text x="0" y="6" text-anchor="middle" class="label-sub">by the district</text>
    <text x="0" y="30" text-anchor="middle" class="label-how">Annual tax bill;</text>
    <text x="0" y="44" text-anchor="middle" class="label-how">may be escrowed</text>
  </g>
  
  <!-- Stream B: Water/Sewer Bill -->
  <g transform="translate(360, 160)">
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-fill"/>
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-stroke"/>
    <rect x="-32" y="-75" width="64" height="20" rx="10" class="badge-bg"/>
    <text x="0" y="-61" text-anchor="middle" class="badge">(b) Utility</text>
    <text x="0" y="-30" text-anchor="middle" class="label-main">Water / sewer bill</text>
    <text x="0" y="-10" text-anchor="middle" class="label-sub">Usage and service</text>
    <text x="0" y="6" text-anchor="middle" class="label-sub">charges for utilities</text>
    <text x="0" y="30" text-anchor="middle" class="label-how">Monthly bill to</text>
    <text x="0" y="44" text-anchor="middle" class="label-how">district operator</text>
  </g>
  
  <!-- Stream C: HOA/PID -->
  <g transform="translate(600, 160)">
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-fill"/>
    <rect x="-100" y="-55" width="200" height="110" rx="5" class="node-stroke"/>
    <rect x="-40" y="-75" width="80" height="20" rx="10" class="badge-bg"/>
    <text x="0" y="-61" text-anchor="middle" class="badge">(c) HOA/PID</text>
    <text x="0" y="-30" text-anchor="middle" class="label-main">HOA and/or PID</text>
    <text x="0" y="-10" text-anchor="middle" class="label-sub">Dues and assessments</text>
    <text x="0" y="6" text-anchor="middle" class="label-sub">(if present)</text>
    <text x="0" y="30" text-anchor="middle" class="label-how">Per association rules</text>
    <text x="0" y="44" text-anchor="middle" class="label-how">or tax bill</text>
  </g>
  
</svg>
