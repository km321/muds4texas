<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="streams-title streams-desc" preserveAspectRatio="xMidYMid meet">
  <title id="streams-title">Three money streams diagram</title>
  <desc id="streams-desc">Visual showing how MUD tax, water bill, and HOA or PID are separate payment streams for a property</desc>
  <style>
    .label-main { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #0B1726; }
    .label-sub { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4A5560; }
    .label-how { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11.5px; font-weight: 400; fill: #4A5560; }
    .node-fill { fill: #F7F8F6; }
    .node-stroke { stroke: #1B4F72; stroke-width: 1.5; fill: none; }
    .node-clay { stroke: #C45C26; stroke-width: 2; fill: none; }
    .connector { stroke: #C5CBC4; stroke-width: 1.5; fill: none; }
    .badge { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #FCFDFB; }
    .badge-bg { fill: #1B4F72; }
    .badge-clay { fill: #C45C26; }
  </style>
  <!-- no full-bleed ground: page card provides the surface -->
  <g transform="translate(480, 36)">
    <rect x="-78" y="-16" width="156" height="32" rx="4" class="node-fill"/>
    <rect x="-78" y="-16" width="156" height="32" rx="4" class="node-stroke"/>
    <text x="0" y="5" text-anchor="middle" class="label-main">Your property</text>
  </g>
  <path d="M480 52 L170 100 M480 52 L480 100 M480 52 L790 100" class="connector"/>
  <g transform="translate(170, 168)">
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-fill"/>
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-clay"/>
    <rect x="-34" y="-70" width="68" height="18" rx="9" class="badge-clay"/>
    <text x="0" y="-57" text-anchor="middle" class="badge">(a) Tax</text>
    <text x="0" y="-26" text-anchor="middle" class="label-main">Ad valorem MUD tax</text>
    <text x="0" y="-6" text-anchor="middle" class="label-sub">Property tax levied by the district</text>
    <text x="0" y="22" text-anchor="middle" class="label-how">Annual tax bill; may be escrowed</text>
  </g>
  <g transform="translate(480, 168)">
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-fill"/>
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-stroke"/>
    <rect x="-38" y="-70" width="76" height="18" rx="9" class="badge-bg"/>
    <text x="0" y="-57" text-anchor="middle" class="badge">(b) Utility</text>
    <text x="0" y="-26" text-anchor="middle" class="label-main">Water / sewer bill</text>
    <text x="0" y="-6" text-anchor="middle" class="label-sub">Usage and service charges for utilities</text>
    <text x="0" y="22" text-anchor="middle" class="label-how">Monthly bill to district operator</text>
  </g>
  <g transform="translate(790, 168)">
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-fill"/>
    <rect x="-140" y="-52" width="280" height="104" rx="5" class="node-stroke"/>
    <rect x="-44" y="-70" width="88" height="18" rx="9" class="badge-bg"/>
    <text x="0" y="-57" text-anchor="middle" class="badge">(c) HOA/PID</text>
    <text x="0" y="-26" text-anchor="middle" class="label-main">HOA and/or PID</text>
    <text x="0" y="-6" text-anchor="middle" class="label-sub">Dues and assessments (if present)</text>
    <text x="0" y="22" text-anchor="middle" class="label-how">Per association rules or tax bill</text>
  </g>
</svg>
