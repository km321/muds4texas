<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="streams-title streams-desc" preserveAspectRatio="xMidYMid meet">
  <title id="streams-title">Three money streams diagram</title>
  <desc id="streams-desc">Visual showing how MUD tax, water bill, and HOA or PID are separate payment streams for a property</desc>
  <style>
    .label-main { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0B1726; }
    .label-sub { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #4A5560; }
    .label-how { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10.5px; font-weight: 400; fill: #4A5560; }
    .node-fill { fill: #F7F8F6; }
    .node-stroke { stroke: #1B4F72; stroke-width: 1.5; fill: none; }
    .node-clay { stroke: #C45C26; stroke-width: 2; fill: none; }
    .connector { stroke: #C5CBC4; stroke-width: 1.5; fill: none; }
    .badge { font-family: "Source Sans 3", system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #FCFDFB; }
    .badge-bg { fill: #1B4F72; }
    .badge-clay { fill: #C45C26; }
    .ground-fill { fill: #E6E9E4; }
  </style>
  <rect x="0" y="0" width="720" height="300" class="ground-fill" rx="6"/>
  <g transform="translate(360, 48)">
    <rect x="-70" y="-18" width="140" height="36" rx="4" class="node-fill"/>
    <rect x="-70" y="-18" width="140" height="36" rx="4" class="node-stroke"/>
    <text x="0" y="5" text-anchor="middle" class="label-main">Your property</text>
  </g>
  <path d="M360 66 L140 118 M360 66 L360 118 M360 66 L580 118" class="connector"/>
  <!-- Stream A -->
  <g transform="translate(140, 190)">
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-fill"/>
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-clay"/>
    <rect x="-30" y="-78" width="60" height="18" rx="9" class="badge-clay"/>
    <text x="0" y="-65" text-anchor="middle" class="badge">(a) Tax</text>
    <text x="0" y="-32" text-anchor="middle" class="label-main">Ad valorem MUD tax</text>
    <text x="0" y="-12" text-anchor="middle" class="label-sub">Property tax levied</text>
    <text x="0" y="4" text-anchor="middle" class="label-sub">by the district</text>
    <text x="0" y="28" text-anchor="middle" class="label-how">Annual tax bill;</text>
    <text x="0" y="42" text-anchor="middle" class="label-how">may be escrowed</text>
  </g>
  <!-- Stream B -->
  <g transform="translate(360, 190)">
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-fill"/>
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-stroke"/>
    <rect x="-34" y="-78" width="68" height="18" rx="9" class="badge-bg"/>
    <text x="0" y="-65" text-anchor="middle" class="badge">(b) Utility</text>
    <text x="0" y="-32" text-anchor="middle" class="label-main">Water / sewer bill</text>
    <text x="0" y="-12" text-anchor="middle" class="label-sub">Usage and service</text>
    <text x="0" y="4" text-anchor="middle" class="label-sub">charges for utilities</text>
    <text x="0" y="28" text-anchor="middle" class="label-how">Monthly bill to</text>
    <text x="0" y="42" text-anchor="middle" class="label-how">district operator</text>
  </g>
  <!-- Stream C -->
  <g transform="translate(580, 190)">
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-fill"/>
    <rect x="-96" y="-58" width="192" height="116" rx="5" class="node-stroke"/>
    <rect x="-40" y="-78" width="80" height="18" rx="9" class="badge-bg"/>
    <text x="0" y="-65" text-anchor="middle" class="badge">(c) HOA/PID</text>
    <text x="0" y="-32" text-anchor="middle" class="label-main">HOA and/or PID</text>
    <text x="0" y="-12" text-anchor="middle" class="label-sub">Dues and assessments</text>
    <text x="0" y="4" text-anchor="middle" class="label-sub">(if present)</text>
    <text x="0" y="28" text-anchor="middle" class="label-how">Per association rules</text>
    <text x="0" y="42" text-anchor="middle" class="label-how">or tax bill</text>
  </g>
</svg>
