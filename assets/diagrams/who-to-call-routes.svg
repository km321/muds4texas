<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <style>
    .label { font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 12px; fill: #4A5560; }
    .label-ink { font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 13px; fill: #0B1726; font-weight: 600; }
    .label-small { font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 11px; fill: #4A5560; }
  </style>
  
  <!-- Start node (clay accent) -->
  <rect x="240" y="20" width="120" height="44" rx="6" fill="#C45C26"/>
  <text x="300" y="47" text-anchor="middle" class="label-ink" fill="#FCFDFB">Your question</text>
  
  <!-- Connector from start -->
  <path d="M300 64 L300 90" stroke="#C5CBC4" stroke-width="1.5"/>
  
  <!-- Decision diamond -->
  <path d="M300 100 L340 130 L300 160 L260 130 Z" fill="#F7F8F6" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="300" y="134" text-anchor="middle" class="label-small">Topic?</text>
  
  <!-- Branch lines -->
  <path d="M260 130 L140 130 L140 180" stroke="#C5CBC4" stroke-width="1.5"/>
  <path d="M300 160 L300 180" stroke="#C5CBC4" stroke-width="1.5"/>
  <path d="M340 130 L460 130 L460 180" stroke="#C5CBC4" stroke-width="1.5"/>
  
  <!-- Tax bill branch -->
  <rect x="80" y="180" width="120" height="52" rx="6" fill="#F7F8F6" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="140" y="202" text-anchor="middle" class="label-ink">Tax bill</text>
  <text x="140" y="220" text-anchor="middle" class="label-small">amount, due dates</text>
  
  <path d="M140 232 L140 260" stroke="#C5CBC4" stroke-width="1.5"/>
  
  <rect x="60" y="260" width="160" height="60" rx="6" fill="#FCFDFB" stroke="#1B4F72" stroke-width="2"/>
  <text x="140" y="286" text-anchor="middle" class="label-ink">County tax office</text>
  <text x="140" y="304" text-anchor="middle" class="label-small">or appraisal district</text>
  
  <!-- Water bill branch -->
  <rect x="240" y="180" width="120" height="52" rx="6" fill="#F7F8F6" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="300" y="202" text-anchor="middle" class="label-ink">Water/sewer bill</text>
  <text x="300" y="220" text-anchor="middle" class="label-small">outage, leak, login</text>
  
  <path d="M300 232 L300 260" stroke="#C5CBC4" stroke-width="1.5"/>
  
  <rect x="220" y="260" width="160" height="60" rx="6" fill="#FCFDFB" stroke="#1B4F72" stroke-width="2"/>
  <text x="300" y="286" text-anchor="middle" class="label-ink">District operator</text>
  <text x="300" y="304" text-anchor="middle" class="label-small">from your water bill</text>
  
  <!-- District/meetings branch -->
  <rect x="400" y="180" width="120" height="52" rx="6" fill="#F7F8F6" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="460" y="202" text-anchor="middle" class="label-ink">Meetings, notices</text>
  <text x="460" y="220" text-anchor="middle" class="label-small">governance, agenda</text>
  
  <path d="M460 232 L460 260" stroke="#C5CBC4" stroke-width="1.5"/>
  
  <rect x="380" y="260" width="160" height="60" rx="6" fill="#FCFDFB" stroke="#1B4F72" stroke-width="2"/>
  <text x="460" y="286" text-anchor="middle" class="label-ink">District website</text>
  <text x="460" y="304" text-anchor="middle" class="label-small">or board contacts</text>
</svg>
